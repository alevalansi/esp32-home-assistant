                  text: "Entrada 2"
            on_click:
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: light.entrada_las_luces_de_la_entrada_interruptor_2
        - button:
            x: 170
            y: 400
            width: 140
            height: 60
            widgets:
              - label:
                  text: "Dormitorio >"
            on_click:
              - lvgl.page.show: page_dormitorio

