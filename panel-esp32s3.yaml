display:
  - platform: ili9xxx
    model: ST7796
    id: my_display
    cs_pin: GPIO10
    dc_pin: GPIO46
    invert_colors: true
    dimensions:
      width: 320
      height: 480
    rotation: 0

touchscreen:
  - platform: ft5x06
    id: my_touch
    display: my_display
    address: 0x38
    interrupt_pin: GPIO17

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  theme:
    button:
      bg_color: 0x444444
      text_color: 0xFFFFFF
      checked:
        bg_color: 0x00AA00
        text_color: 0xFFFFFF
  pages:
    - id: page_salon
      widgets:
        - label:
            text: "Salon / Entrada  1/3"
            align: TOP_MID
            y: 8
            text_color: 0xFFFFFF
        - button:
            id: btn_salon1
            x: 10
            y: 45
            width: 145
            height: 90
            checkable: true
            widgets:
              - label:
                  text: "Salon 1"
            on_click:
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: light.salon_luces_del_salon_interruptor_1
        - button:
            id: btn_salon2
            x: 165
            y: 45
            width: 145
            height: 90
            checkable: true
            widgets:
              - label:
                  text: "Salon 2"
            on_click:
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: light.salon_luces_del_salon_interruptor_2
        - button:
            id: btn_entrada1
            x: 10
            y: 145
            width: 145
            height: 90
            checkable: true
            widgets:
              - label:
                  text: "Entrada 1"
            on_click:
              - homeassistant.service:
                  service: homeassistant.toggle
                  data:
                    entity_id: light.entrada_las_luces_de_la_entrada_interruptor_1
        - button:
