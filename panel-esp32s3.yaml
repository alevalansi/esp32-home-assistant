esphome:
  name: panel-esp32s3
  friendly_name: "Panel Freenove 4.0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome

logger:

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true

output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pin

light:
  - platform: monochromatic
    output: backlight_pin
    name: "Brillo Pantalla"
    id: backlight
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: homeassistant
    id: bs_salon1
    entity_id: light.salon_luces_del_salon_interruptor_1
    on_state:
      - if:
          condition:
            lambda: "return x;"
          then:
            - lvgl.widget.update:
                id: btn_salon1
                state:
                  checked: true
          else:
            - lvgl.widget.update:
                id: btn_salon1
                state:
                  checked: false
